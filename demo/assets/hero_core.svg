<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 450" width="100%" height="100%">
  <defs>
    <linearGradient id="coreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.05"/>
    </linearGradient>
    <filter id="shadowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background decorative ring -->
  <circle cx="250" cy="225" r="195" fill="none" stroke="#334155" stroke-width="1.5" stroke-dasharray="6 6"/>
  <circle cx="250" cy="225" r="160" fill="url(#glowGrad)" stroke="#0ea5e9" stroke-width="2"/>

  <!-- Connection Lines -->
  <!-- Top: IDE -->
  <line x1="250" y1="140" x2="250" y2="70" stroke="#38bdf8" stroke-width="3" stroke-dasharray="4 4"/>
  <!-- Bottom-Left: GitLab CI/CD -->
  <line x1="180" y1="275" x2="110" y2="340" stroke="#f59e0b" stroke-width="3" stroke-dasharray="4 4"/>
  <!-- Bottom-Right: MCP Automations -->
  <line x1="320" y1="275" x2="390" y2="340" stroke="#10b981" stroke-width="3" stroke-dasharray="4 4"/>

  <!-- Center Hub: GitHub Copilot + HVE Core -->
  <g transform="translate(170, 145)" filter="url(#shadowFilter)">
    <rect x="0" y="0" width="160" height="160" rx="32" fill="#0f172a" stroke="#38bdf8" stroke-width="4"/>
    <circle cx="80" cy="65" r="38" fill="#0284c7" stroke="#7dd3fc" stroke-width="2"/>
    <text x="80" y="78" font-size="38" text-anchor="middle">🤖</text>
    <text x="80" y="122" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">HVE CORE</text>
    <text x="80" y="142" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" fill="#38bdf8" text-anchor="middle">GitHub Copilot</text>
  </g>

  <!-- Node 1: Top (VS Code / IDE Context) -->
  <g transform="translate(160, 25)" filter="url(#shadowFilter)">
    <rect x="0" y="0" width="180" height="48" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <text x="90" y="28" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="bold" fill="#f1f5f9" text-anchor="middle">💻 VS Code / IDE</text>
    <text x="90" y="42" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">applyTo Rules Scope</text>
  </g>

  <!-- Node 2: Bottom-Left (GitLab CI/CD) -->
  <g transform="translate(20, 340)" filter="url(#shadowFilter)">
    <rect x="0" y="0" width="170" height="52" rx="12" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
    <text x="85" y="28" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="bold" fill="#fbbf24" text-anchor="middle">🦊 GitLab CI/CD</text>
    <text x="85" y="44" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" fill="#cbd5e1" text-anchor="middle">SHA-256 &amp; Pipeline Gate</text>
  </g>

  <!-- Node 3: Bottom-Right (MCP Automations) -->
  <g transform="translate(310, 340)" filter="url(#shadowFilter)">
    <rect x="0" y="0" width="170" height="52" rx="12" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
    <text x="85" y="28" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="bold" fill="#34d399" text-anchor="middle">⚡ MCP Automations</text>
    <text x="85" y="44" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" fill="#cbd5e1" text-anchor="middle">Nightly Draft MR</text>
  </g>

  <!-- Floating Badge: Enterprise Guardrails -->
  <g transform="translate(40, 185)">
    <rect x="0" y="0" width="105" height="28" rx="14" fill="#082f49" stroke="#0ea5e9" stroke-width="1.5"/>
    <text x="52" y="19" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="bold" fill="#7dd3fc" text-anchor="middle">🛡️ Guardrails</text>
  </g>

  <!-- Floating Badge: RPI Flow -->
  <g transform="translate(355, 185)">
    <rect x="0" y="0" width="105" height="28" rx="14" fill="#451a03" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="52" y="19" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="bold" fill="#fde68a" text-anchor="middle">🔁 RPI Flow</text>
  </g>

  <!-- Bottom Subtitle Banner -->
  <text x="250" y="430" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="bold" fill="#94a3b8" text-anchor="middle">ENTERPRISE AGENTIC SDLC FOR GITHUB COPILOT</text>
</svg>
