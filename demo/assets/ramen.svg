<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bowlGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
    <linearGradient id="soupGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background glow circle -->
  <circle cx="250" cy="260" r="190" fill="#1e293b" opacity="0.6"/>

  <!-- Steam lines -->
  <path d="M 200 170 Q 185 130 200 90 T 200 40" stroke="#38bdf8" stroke-width="6" stroke-linecap="round" fill="none" opacity="0.8"/>
  <path d="M 250 160 Q 270 120 250 80 T 250 30" stroke="#38bdf8" stroke-width="7" stroke-linecap="round" fill="none" opacity="0.9" filter="url(#glow)"/>
  <path d="M 300 175 Q 315 135 300 95 T 300 45" stroke="#38bdf8" stroke-width="6" stroke-linecap="round" fill="none" opacity="0.8"/>

  <!-- Chopsticks lifting noodles -->
  <line x1="120" y1="120" x2="390" y2="70" stroke="#fcd34d" stroke-width="10" stroke-linecap="round"/>
  <line x1="130" y1="140" x2="390" y2="85" stroke="#f59e0b" stroke-width="9" stroke-linecap="round"/>

  <!-- Noodles hanging from chopsticks -->
  <path d="M 230 100 Q 220 150 225 210 Q 235 150 245 100" fill="#fde68a" stroke="#d97706" stroke-width="3"/>
  <path d="M 260 95 Q 275 145 265 210 Q 255 145 250 95" fill="#fde68a" stroke="#d97706" stroke-width="3"/>
  <path d="M 285 90 Q 295 140 280 200 Q 270 140 275 90" fill="#fde68a" stroke="#d97706" stroke-width="3"/>

  <!-- Ramen Bowl -->
  <path d="M 110 220 C 110 370 390 370 390 220 Z" fill="url(#bowlGrad)"/>
  <!-- Bowl Rim -->
  <ellipse cx="250" cy="220" rx="140" ry="32" fill="#dc2626" stroke="#fca5a5" stroke-width="4"/>
  <!-- Soup inside -->
  <ellipse cx="250" cy="225" rx="130" ry="24" fill="url(#soupGrad)"/>

  <!-- Noodles inside bowl -->
  <path d="M 160 225 Q 180 240 210 225 Q 240 215 270 230 Q 300 240 330 225" fill="none" stroke="#fef08a" stroke-width="7" stroke-linecap="round"/>
  <path d="M 170 232 Q 200 245 230 230 Q 260 220 290 235 Q 315 242 335 230" fill="none" stroke="#fef08a" stroke-width="6" stroke-linecap="round"/>

  <!-- Toppings: Egg, Narutomaki, Green Onions -->
  <!-- Boiled Egg half -->
  <ellipse cx="210" cy="220" rx="28" ry="18" fill="#ffffff" transform="rotate(-15 210 220)"/>
  <circle cx="212" cy="220" r="11" fill="#f59e0b"/>

  <!-- Narutomaki (fish cake) -->
  <ellipse cx="295" cy="225" rx="22" ry="15" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <path d="M 295 225 C 290 220 300 218 302 225 C 304 230 288 232 286 225" fill="none" stroke="#ec4899" stroke-width="3"/>

  <!-- Nori Seaweed -->
  <rect x="315" y="180" width="35" height="45" rx="4" fill="#14532d" transform="rotate(20 315 180)"/>

  <!-- Bowl Stand/Base -->
  <path d="M 200 360 L 300 360 L 290 380 L 210 380 Z" fill="#7f1d1d"/>

  <!-- Badge / Logo on Bowl: "HVE CORE" -->
  <rect x="180" y="270" width="140" height="38" rx="19" fill="#1e293b" stroke="#38bdf8" stroke-width="2.5"/>
  <text x="250" y="295" font-family="system-ui, sans-serif" font-size="16" font-weight="900" fill="#38bdf8" text-anchor="middle" letter-spacing="1.5">⚡ HVE CORE</text>
  <text x="250" y="430" font-family="system-ui, sans-serif" font-size="22" font-weight="bold" fill="#fcd34d" text-anchor="middle">&quot;MÌ ĂN LIỀN&quot; CHO GITHUB COPILOT</text>
</svg>
