<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 450" width="100%" height="100%">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <!-- Big Shield -->
  <path d="M 250 30 Q 380 30 400 130 C 400 270 250 380 250 400 C 250 380 100 270 100 130 Q 120 30 250 30 Z" 
        fill="url(#shieldGrad)" stroke="#38bdf8" stroke-width="8"/>

  <!-- Inner Shield Glow -->
  <path d="M 250 55 Q 360 55 375 140 C 375 255 250 350 250 370 C 250 350 125 255 125 140 Q 140 55 250 55 Z" 
        fill="#1e293b" opacity="0.85" stroke="#0ea5e9" stroke-width="3" stroke-dasharray="8 6"/>

  <!-- Center Lock / Checkmark -->
  <circle cx="250" cy="180" r="48" fill="#0369a1" stroke="#38bdf8" stroke-width="4"/>
  <path d="M 230 180 L 245 195 L 275 165" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 4 Badges on the shield -->
  <!-- 1. Mask PII -->
  <g transform="translate(145, 240)">
    <rect x="0" y="0" width="100" height="32" rx="6" fill="#78350f" stroke="#f59e0b" stroke-width="2"/>
    <text x="50" y="21" font-family="sans-serif" font-size="12" font-weight="bold" fill="#fde68a" text-anchor="middle">🔒 MASK PII</text>
  </g>

  <!-- 2. Block XSS -->
  <g transform="translate(255, 240)">
    <rect x="0" y="0" width="100" height="32" rx="6" fill="#831843" stroke="#f43f5e" stroke-width="2"/>
    <text x="50" y="21" font-family="sans-serif" font-size="12" font-weight="bold" fill="#fbcfe8" text-anchor="middle">🛡️ ANTI-XSS</text>
  </g>

  <!-- 3. SHA-256 Digest -->
  <g transform="translate(145, 285)">
    <rect x="0" y="0" width="100" height="32" rx="6" fill="#14532d" stroke="#22c55e" stroke-width="2"/>
    <text x="50" y="21" font-family="sans-serif" font-size="12" font-weight="bold" fill="#bbf7d0" text-anchor="middle">📦 SHA-256</text>
  </g>

  <!-- 4. Leak-Free -->
  <g transform="translate(255, 285)">
    <rect x="0" y="0" width="100" height="32" rx="6" fill="#1e1b4b" stroke="#818cf8" stroke-width="2"/>
    <text x="50" y="21" font-family="sans-serif" font-size="12" font-weight="bold" fill="#c7d2fe" text-anchor="middle">⚡ LEAK-FREE</text>
  </g>

  <text x="250" y="340" font-family="sans-serif" font-size="14" font-weight="bold" fill="#38bdf8" text-anchor="middle">applyTo: *.kt · *.scala · *.ts · CI</text>
</svg>
