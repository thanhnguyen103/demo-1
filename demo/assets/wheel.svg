<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 360" width="100%" height="100%">
  <!-- Background subtle glow -->
  <rect x="0" y="0" width="500" height="360" rx="20" fill="#1e293b" opacity="0.5"/>

  <!-- Left Side: Struggling with Square Wheel -->
  <g transform="translate(30, 40)">
    <!-- Caveman / Dev pushing hard -->
    <circle cx="60" cy="140" r="22" fill="#f87171"/>
    <!-- Body -->
    <line x1="60" y1="162" x2="90" y2="230" stroke="#f87171" stroke-width="8" stroke-linecap="round"/>
    <!-- Arms pushing -->
    <line x1="70" y1="180" x2="115" y2="195" stroke="#f87171" stroke-width="7" stroke-linecap="round"/>
    <!-- Legs -->
    <line x1="90" y1="230" x2="60" y2="290" stroke="#f87171" stroke-width="8" stroke-linecap="round"/>
    <line x1="90" y1="230" x2="110" y2="285" stroke="#f87171" stroke-width="8" stroke-linecap="round"/>
    <!-- Sweat drops -->
    <path d="M 35 130 Q 30 140 33 145 Q 38 145 37 135 Z" fill="#38bdf8"/>
    <path d="M 25 145 Q 20 155 23 160 Q 28 160 27 150 Z" fill="#38bdf8"/>

    <!-- Square Wheel -->
    <rect x="120" y="160" width="100" height="100" rx="6" fill="#475569" stroke="#ef4444" stroke-width="5" transform="rotate(15 170 210)"/>
    <circle cx="170" cy="210" r="10" fill="#ef4444"/>

    <!-- Label Left -->
    <rect x="30" y="305" width="170" height="32" rx="6" fill="#7f1d1d"/>
    <text x="115" y="327" font-family="sans-serif" font-size="14" font-weight="bold" fill="#fca5a5" text-anchor="middle">❌ Tự chế từ số 0</text>
  </g>

  <!-- VS Arrow -->
  <circle cx="250" cy="180" r="28" fill="#334155"/>
  <text x="250" y="188" font-family="sans-serif" font-size="20" font-weight="900" fill="#f59e0b" text-anchor="middle">VS</text>

  <!-- Right Side: Smooth Round Wheel (HVE Core) -->
  <g transform="translate(260, 40)">
    <!-- Round Wheel -->
    <circle cx="120" cy="205" r="55" fill="#0284c7" stroke="#38bdf8" stroke-width="6"/>
    <!-- Spokes -->
    <line x1="120" y1="150" x2="120" y2="260" stroke="#bae6fd" stroke-width="4"/>
    <line x1="65" y1="205" x2="175" y2="205" stroke="#bae6fd" stroke-width="4"/>
    <line x1="80" y1="165" x2="160" y2="245" stroke="#bae6fd" stroke-width="4"/>
    <line x1="80" y1="245" x2="160" y2="165" stroke="#bae6fd" stroke-width="4"/>
    <circle cx="120" cy="205" r="16" fill="#0369a1" stroke="#ffffff" stroke-width="3"/>

    <!-- Happy Dev relaxing/guiding -->
    <circle cx="195" cy="130" r="22" fill="#4ade80"/>
    <line x1="195" y1="152" x2="190" y2="220" stroke="#4ade80" stroke-width="8" stroke-linecap="round"/>
    <line x1="190" y1="175" x2="150" y2="195" stroke="#4ade80" stroke-width="7" stroke-linecap="round"/>
    <line x1="190" y1="220" x2="185" y2="285" stroke="#4ade80" stroke-width="8" stroke-linecap="round"/>

    <!-- Label Right -->
    <rect x="40" y="305" width="160" height="32" rx="6" fill="#14532d"/>
    <text x="120" y="327" font-family="sans-serif" font-size="14" font-weight="bold" fill="#86efac" text-anchor="middle">✅ HVE Core Pattern</text>
  </g>

  <!-- Ground line -->
  <line x1="30" y1="330" x2="470" y2="330" stroke="#64748b" stroke-width="4" stroke-linecap="round"/>
</svg>
